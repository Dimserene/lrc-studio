<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'"><title>拍點 LRC</title><link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="app.js" defer></script></head>
<body><main id="workspace">
<header><div><span class="eyebrow">LYRIC TIMING STUDIO</span><h1>拍點 <span>LRC</span></h1></div><button id="more" class="icon" aria-label="更多工具">•••</button></header>
<section class="player card" id="playerCard"><div class="connection"><span id="statusDot" class="dot"></span><span id="status">等待連接 YouTube Music</span><button id="connect" class="link">連接</button><button id="togglePlayer" class="link" aria-expanded="true" aria-label="收合播放器">收合 ▴</button></div><div class="track"><div class="cover" aria-hidden="true">♫</div><div class="tracktext"><strong id="song">先在 YouTube Music 播放歌曲</strong><small id="artist">回到這裡，就能開始對時</small></div><button id="openMusic" class="icon" aria-label="開啟 YouTube Music">↗</button></div><div class="clockrow"><span id="clock">00:00.00</span><span id="duration">／ --:--</span><span class="live" id="live">未同步</span><button id="compactPlay" disabled>播放</button></div><input type="range" id="seekbar" min="0" max="1" value="0" aria-label="播放進度" disabled><div class="transport"><button id="back5" disabled>↶ 5 秒</button><button id="play" disabled>播放</button><button id="next5" disabled>5 秒 ↷</button></div><button id="bind" class="bind" disabled>將目前歌曲連結到這份歌詞</button><div id="mismatch" class="warning" hidden></div></section>
<nav class="filebar"><button id="import">匯入</button><button id="paste">貼上歌詞</button><button id="export" class="accent">匯出 LRC ↗</button></nav>
<section class="editor card"><div class="editorhead"><div><h2 id="docTitle">歌詞工作區</h2><small id="progress">0 / 0 句已打點</small></div><div class="historybuttons"><button id="undo" disabled aria-label="撤銷上一步">撤銷</button><button id="redo" disabled aria-label="重做上一步">重做</button></div></div><div class="editornav"><button id="findMissing" disabled>下一個未打點</button><button id="follow" aria-pressed="true">字幕跟隨：開</button><button id="locate" disabled>回到選句</button></div><div id="rows" role="listbox" aria-label="歌詞行"><div class="empty"><div>♪</div><h3>把歌詞放進來</h3><p>貼上純文字，或匯入現有 LRC。<br>聽到每句開頭時，按下方「打點」。</p></div></div></section>
<footer><div class="selection"><div class="selectedcopy"><span id="selectedLabel">選取一句，準備打點</span><strong id="selectedText"></strong></div><button id="rearm" hidden>重新打點</button><button id="edit" disabled>編輯此句</button></div><div class="stampbar"><button id="previous" aria-label="上一句">↑</button><button id="stamp" disabled>● 打點，下一句</button><button id="next" aria-label="下一句">↓</button></div><div class="micro"><button id="minus" disabled>−0.05 秒</button><button id="nudgeStep" aria-label="切換時間微調幅度">幅度 0.05 秒</button><button id="plus" disabled>＋0.05 秒</button></div><div class="footerstatus"><span id="saveStatus">草稿自動保存</span><span id="modeStatus">依序打點</span></div></footer>
</main><dialog id="dialog"><form method="dialog"><div class="dialoghead"><h2 id="dialogTitle"></h2><button value="cancel" aria-label="關閉">✕</button></div><div id="dialogBody"></div><div id="dialogError" class="warning" hidden></div><div class="dialogactions"><button value="cancel">取消</button><button type="button" id="dialogApply" class="accent">套用</button></div></form></dialog><div id="toast" role="status"></div></body></html>
